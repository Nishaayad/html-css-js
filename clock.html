<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Typo fixed -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Typo fixed -->
	<title>Analog Clock</title>
	<link rel="stylesheet" type="text/css" href="clock.css">
</head>
<body>
    <div class="wrapper">
        <div class="bar-seconds"></div>
        <div class="number-hours"></div>

        <div class="hands-box">  	
            <div class="hand hours"><i></i></div>
            <div class="hand minutes"><i></i></div>
            <div class="hand seconds"><i></i></div>
        </div>
    </div>

    <script src="clock.js"></script>
</body>
</html>
